<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1200" height="800" fill="#ffffff"/><text x="40" y="52" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" text-anchor="start">How a goal flows through the team</text><text x="40" y="80" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#57606a" text-anchor="start">A standard user-facing goal. You are asked at the three red markers; everything else runs on its own.</text><rect x="40" y="120" width="210" height="120" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="145.0" y="167.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">You describe</text><text x="145.0" y="185.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">a goal</text><text x="145.0" y="203.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">plain words or /devteam:goal</text><circle cx="40" cy="120" r="13" fill="#0969da"/><text x="40" y="125" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="268" y="120" width="210" height="120" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/><text x="373.0" y="167.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight