="400" fill="#57606a" text-anchor="middle">tokens, layout, real content</text><circle cx="268" cy="330" r="13" fill="#1a7f37"/><text x="268" y="335" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><rect x="496" y="330" width="210" height="120" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="601.0" y="377.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Build</text><text x="601.0" y="395.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Full-Stack Engineer</text><text x="601.0" y="413.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">one task at a time, self-review</text><circle cx="496" cy="330" r="13" fill="#1a7f37"/><text x="496" y="335" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><rect x="724" y="330" width="210" height="120" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="829.0" y="377.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Verify</text><text x="829.0" y="395.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">QA Engineer</text><text x="829.0" y="413.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">gates + shots at 390/768/1280</text><circle cx="724" cy