6700"/><text x="496" y="125" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="614" y="109" width="80.0" height="22" rx="11" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/><text x="654.0" y="124" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">YOU DECIDE</text><rect x="724" y="120" width="210" height="120" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="829.0" y="167.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Research</text><text x="829.0" y="185.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Research Analyst</text><text x="829.0" y="203.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">verified versions, cited</text><circle cx="724" cy="120" r="13" fill="#1a7f37"/><text x="724" y="125" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="952" y="120" width="210" height="120" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="1057.0" y="167.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Acceptance tests</text><text x="1057.0" y="185.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">QA Engineer</text><text x="1057.0" y="203.0" font-family="Inter, -