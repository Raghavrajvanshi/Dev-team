<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1200" height="580" fill="#ffffff"/><text x="40" y="52" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" text-anchor="start">The life of a goal</text><text x="40" y="80" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#57606a" text-anchor="start">One goal at a time. Every transition is made by the dt script, and only dt closes a goal.</text><rect x="40" y="200" width="130" height="64" rx="12" fill="#eaeef2" stroke="#57606a" stroke-width="1.6"/><text x="105.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">ONBOARDING</text><rect x="230" y="200" width="130" height="64" rx="12" fill="#eaeef2" stroke="#57606a" stroke-width="1.6"/><text x="295.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">IDLE</text><rect x="420" y="200" width="130" height="64" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/><text x="485.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">INTAKE</text><rect x="610" y="200" width="170" height="64" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="695.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">ACTIVE</text><rect x="860" y="200" width="140" height="64" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/><text x="930.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">VERIFYING</text><rect x="1050" y="200" width="130" height="64" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="1115.0" y="237.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">ACHIEVED</text><path d="M172,232.0 L228,232.0" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="200.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">start</text><path d="M362,232.0 L418,232.0" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="390.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">goal</text><path d="M552,232.0 L608,232.0" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="580.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">confirm</text><path d="M782,232.0 L858,232.0" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="820.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">done</text><path d="M1002,232.0 L1048,232.0" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="1025.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">close</text><path d="M1115,198 L1115,136 L295,136 L295,198" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="705" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">closed: nothing keeps running, the next message starts a new goal</text><path d="M900,198 Q830,148 765,198" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="830" y="156" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle">criteria fail (max 2 returns)</text><rect x="500" y="380" width="140" height="64" rx="12" fill="#eaeef2" stroke="#57606a" stroke-width="1.6"/><text x="570.0" y="417.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">PAUSED</text><rect x="760" y="380" width="150" height="64" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/><text x="835.0" y="408.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">BLOCKED</text><text x="835.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">waiting on you</text><path d="M650,266 L600,378" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><path d="M625,378 L685,266" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="552" y="322" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="end">you pause</text><text x="672" y="322" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">resume</text><path d="M740,266 L800,378" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><path d="M830,378 L770,266" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="832" y="300" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">stall, cap, tamper,</text><text x="832" y="315" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">failing gates</text><text x="850" y="362" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">you resolve</text><rect x="230" y="380" width="130" height="64" rx="12" fill="#eaeef2" stroke="#57606a" stroke-width="1.6"/><text x="295.0" y="417.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">STOPPED</text><path d="M295,378 L295,266" fill="none" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="211.0" y="322.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">cleaned up, team stood down</text><text x="295" y="470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">/devteam:stop works from any state</text><text x="40" y="540" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">Gates never block you; they stop a goal from closing. Hooks are a second line of defence; the close gate has the last word.</text></svg>
